# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
server.port=8082

# ─────────────────────────────────────────────────────────────────────────────
# JWT — replace secret with a secure random Base64-encoded 256-bit key in prod
# Generate with: openssl rand -base64 32
# ─────────────────────────────────────────────────────────────────────────────
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRY_MS:86400000}

# ─────────────────────────────────────────────────────────────────────────────
# Neon PostgreSQL (fill in your values from console.neon.tech)
# Connection Details → JDBC format
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; Neon is serverless so keep pool small)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────────────────────────
# "update" auto-creates/alters the `tickets` table on first run.
# Switch to "validate" once the schema is stable, or use Flyway for migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────────────────────────────────────
# Redis (local; starts with `docker-compose up -d`)
# ─────────────────────────────────────────────────────────────────────────────
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}
spring.redis.password=${REDIS_PASSWORD:}

# ─────────────────────────────────────────────────────────────────────────────
# CORS Allowed Origin (Default to localhost for development)
# ─────────────────────────────────────────────────────────────────────────────
app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:4200}

# ─────────────────────────────────────────────────────────────────────────────
# Spring Actuator — expose health + Prometheus metrics
# ─────────────────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=ticket-booking
spring.jpa.open-in-view=false

# ─────────────────────────────────────────────────────────────────────────────
# Resilience4j — Circuit Breaker on Redis
# Opens after 50% failures in a 10-call sliding window
# ─────────────────────────────────────────────────────────────────────────────
resilience4j.circuitbreaker.instances.redis.sliding-window-size=10
resilience4j.circuitbreaker.instances.redis.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.redis.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.redis.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.redis.register-health-indicator=true
