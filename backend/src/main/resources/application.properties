# ─────────────────────────────────────────────────────────────────────────────
# Server
# ─────────────────────────────────────────────────────────────────────────────
server.port=8082

# ─────────────────────────────────────────────────────────────────────────────
# JWT — replace secret with a secure random Base64-encoded 256-bit key in prod
# Generate with: openssl rand -base64 32
# ─────────────────────────────────────────────────────────────────────────────
app.jwt.secret=dGlja2V0Ym9va2luZ3N5c3RlbS1zZWNyZXQta2V5LTI1NmJpdC0yMDI2
app.jwt.expiration-ms=86400000

# ─────────────────────────────────────────────────────────────────────────────
# Neon PostgreSQL (fill in your values from console.neon.tech)
# Connection Details → JDBC format
# ─────────────────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://ep-icy-waterfall-aq6zyj3r-pooler.c-8.us-east-1.aws.neon.tech/neondb?sslmode=require
spring.datasource.username=neondb_owner
spring.datasource.password=npg_QH8C3BDunWxR
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection pool (HikariCP defaults are fine; Neon is serverless so keep pool small)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ─────────────────────────────────────────────────────────────────────────────
# JPA / Hibernate
# ─────────────────────────────────────────────────────────────────────────────
# "update" auto-creates/alters the `tickets` table on first run.
# Switch to "validate" once the schema is stable, or use Flyway for migrations.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ─────────────────────────────────────────────────────────────────────────────
# Redis (local; starts with `docker-compose up -d`)
# ─────────────────────────────────────────────────────────────────────────────
spring.redis.host=localhost
spring.redis.port=6379
